[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-anomaly-detector"
version = "0.1.0"
description = "Offline LSTM autoencoder for conveyor belt vibration anomaly detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.3,<2",
    "statsmodels>=0.14,<1",
    "matplotlib>=3.7,<4",
    "joblib>=1.3,<2",
]

[project.optional-dependencies]
train = ["tensorflow>=2.16,<3"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
